name: Deploy backend

# Deploys the cell-ministry-api worker on push to main (Ceang@techpros.com.ng
# Cloudflare account). Schema: migrations/*.sql -- all four are already applied
# to the remote `cell-ministry` D1, so this workflow intentionally deploys code
# only. Requires repo secrets CF_API_TOKEN + CF_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Ceang account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cell-ministry --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Verify health
        run: |
          body="$(curl -fsS https://cell-ministry-api.ceang.workers.dev/api/health)"
          echo "$body"
          echo "$body" | grep -q "cell-ministry-api" || {
            echo "::error::cell-ministry-api health check failed"; exit 1; }